<title>Careerly</title>

<style>
/* Layout: app shell — fixed sidebar + working canvas; mirrors the real Careerly product UI */
:root {
  --bg: #ffffff; --panel: #f7f8fb; --card: #ffffff; --fg: #181b25; --muted: #5f6577; --line: #e3e6ee; --input: #d6dae5;

}

  --accent: #8b85f5; --accent-fg: #12141b; --accent-soft: #2a2950; --accent-ink: #c9c6ff;
  --good: #4cc38a; --warn: #f0b040; --bad: #ef6b6b; --s1: #3987e5; --s2: #d95926; color-scheme: dark; } }
:root[data-theme="dark"] {

  --accent: #8b85f5; --accent-fg: #12141b; --accent-soft: #2a2950; --accent-ink: #c9c6ff;
  --good: #4cc38a; --warn: #f0b040; --bad: #ef6b6b; --s1: #3987e5; --s2: #d95926; color-scheme: dark; }

.t th { position: sticky; top: 0; background: var(--panel); text-align: left; font-weight: 550; color: var(--muted); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); white-space: nowrap; cursor: pointer; user-select: none; z-index: 1; }

.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
/* panel & modal */
.scrim { position: fixed; inset: 0; background: rgb(10 12 20 / .45); z-index: 40; }

.panel header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.panel .body { overflow: auto; padding: 16px 18px; display: grid; gap: 12px; align-content: start; }
.modal { position: fixed; z-index: 41; left: 50%; top: 50%; translate: -50% -50%; width: min(640px, calc(100% - 32px)); max-height: calc(100% - 40px); overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 14px; }

.mobile-top { display: none; }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }

  .side.open { transform: none; }

@media (prefers-reduced-motion: reduce) { .side { transition: none; } }

<script>

const KEY = "careerly-demo-v1";

    ws: { name: "Investissement immobilier CDI 2027", objective: "Diplômé en juin 2027, je cherche un poste d'analyste en investissement bien rémunéré à Paris ou Londres, idéalement en private equity immobilier.", locations: ["Paris", "Londres"], roles: ["Analyste investissement"] },

let S;

// ───────────────────────── Helpers ─────────────────────────
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

const rowName = (r) => r.cells[primary().id]?.v || "Sans nom";
const vt = (f) => (f.type === "AI" ? f.vt || "TEXT" : f.type);
const today = () => new Date().toISOString().slice(0, 10);
function num(s) {

}
const banner = `<div class="banner" role="note"><b>Démo</b><span>Les recherches Internet, l'IA et la découverte de contacts nécessitent la version complète avec ses clés API. Ici, tout le reste fonctionne avec ce que vous saisissez.</span></div>`;
function route() {

function actions() {
  const out = [];
  const ai = S.fields.filter((f) => f.type === "AI");
  const missing = ai.reduce((a, f) => a + S.rows.filter((r) => !r.cells[f.id]?.v).length, 0);
  for (const c of S.contacts) for (const n of c.log || []) if (n.follow && !n.done) { const d = Math.ceil((new Date(n.follow) - new Date(today())) / 864e5); out.push({ p: d <= 0 ? 90 : 70 - d, t: `Relancer ${c.name}`, r: d <= 0 ? `Relance prévue le ${fmtD(n.follow)} : en retard.` : `Relance prévue dans ${d} jour${d > 1 ? "s" : ""}.`, h: "#reseau" }); }
  for (const a of S.apps) if (a.deadline && STAGES_APP.indexOf(a.stage) < 3) { const d = Math.ceil((new Date(a.deadline) - new Date(today())) / 864e5); if (d >= 0 && d <= 21) out.push({ p: 95 - d * 3, t: `Envoyer la candidature : ${a.role} · ${a.company}`, r: `Date limite dans ${d} jour${d > 1 ? "s" : ""}, étape encore « ${a.stage} ».`, h: "#candidatures" }); }
  const nc = S.contacts.find((c) => STAGES_NET.indexOf(c.stage) <= 1);
  if (nc) out.push({ p: 55, t: `Contacter ${nc.name}${nc.company ? ` (${nc.company})` : ""}`, r: "Contact présélectionné à qui vous n'avez pas encore écrit.", h: "#reseau" });
  if (missing) out.push({ p: 40, t: `Compléter ${missing} valeur${missing > 1 ? "s" : ""} à rechercher`, r: `${ai.length} colonne${ai.length > 1 ? "s" : ""} « recherche IA » encore vide${ai.length > 1 ? "s" : ""}. Ouvrez une entreprise pour ajouter une valeur avec sa source.`, h: "#entreprises" });
  if (!S.contacts.length) out.push({ p: 35, t: "Ajouter une première personne à contacter", r: "Un analyste ou un ancien de votre école chez l'un de vos fonds cibles.", h: "#reseau" });
  if (!S.apps.length) out.push({ p: 30, t: "Suivre une première candidature", r: "Ajoutez un poste visé, même au stade de la recherche.", h: "#candidatures" });
  return out.sort((a, b) => b.p - a.p).slice(0, 5);
}

    <div class="card"><h2>En chiffres</h2><p>Ce que contient cet espace.</p>
      <div class="grid" style="gap:10px">
        ${[["Entreprises", S.rows.length, "#entreprises"], ["Valeurs sourcées", filled, "#entreprises"], ["Contacts", S.contacts.length, "#reseau"], ["Candidatures", S.apps.length, "#candidatures"]].map(([l, n, h]) => `<a href="${h}" class="row" style="justify-content:space-between;text-decoration:none;color:inherit"><span>${l}</span><b style="font-variant-numeric:tabular-nums">${n}</b></a>`).join("")}

// ───────────────────────── Table ─────────────────────────
let sort = null, search = "", editing = null;
function viewTable() {
  let rows = S.rows.filter((r) => !search || Object.values(r.cells).some((c) => String(c.v ?? "").toLowerCase().includes(search.toLowerCase())));
  if (sort) { const f = S.fields.find((x) => x.id === sort.id); rows = [...rows].sort((a, b) => { const x = a.cells[f.id]?.v ?? "", y = b.cells[f.id]?.v ?? ""; if (x === "" && y === "") return 0; if (x === "") return 1; if (y === "") return -1; const nx = num(x), ny = num(y); const r = nx != null && ny != null ? nx - ny : String(x).localeCompare(String(y), "fr", { numeric: true }); return sort.dir * r; }); }
  return `
  <div class="head"><div><h1>Entreprises</h1><p class="sub">Double-cliquez (ou Entrée) sur une cellule pour la modifier. Cliquez sur un nom pour voir les preuves et l'historique.</p></div>
    <div class="row"><button class="btn" data-act="addfield">+ Champ</button><button class="btn" data-act="copycsv">Copier en CSV</button><button class="btn pri" data-act="research" data-scope="table">Rechercher les champs IA</button></div></div>
  <div class="row"><input class="in" style="max-width:280px" id="q" placeholder="Rechercher dans le tableau" value="${esc(search)}" aria-label="Rechercher"><span class="meta" style="margin-left:auto">${rows.length} sur ${S.rows.length} lignes</span></div>
  <div class="tablebox"><table class="t" aria-label="Entreprises"><thead><tr>${S.fields.map((f) => `<th data-sort="${f.id}" title="${esc(TYPES[f.type])}${f.prompt ? " · " + esc(f.prompt) : ""}">${f.type === "AI" ? "✦ " : ""}${esc(f.name)} ${sort?.id === f.id ? (sort.dir > 0 ? "↑" : "↓") : ""}</th>`).join("")}</tr></thead>
  <tbody>${rows.map((r) => `<tr>${S.fields.map((f) => cellHtml(r, f)).join("")}</tr>`).join("")}</tbody></table></div>
  <form class="row" id="addRow"><input class="in" style="max-width:280px" id="newRow" placeholder="+ Ajouter une entreprise" aria-label="Nouvelle entreprise"><button class="btn sm" type="submit">Ajouter</button></form>
  <div class="legend">${Object.values(CONF).map(([l, , c, h]) => `<span title="${h}"><i class="dot" style="background:${c}"></i>${l}</span>`).join("")}<span>🔒 Confirmé par vous : jamais écrasé par une recherche</span></div>`;
}
function cellHtml(r, f) {
  const c = r.cells[f.id] || {};
  if (editing && editing.r === r.id && editing.f === f.id) {
    const t = vt(f);
    return `<td><input class="in" id="cellEdit" value="${esc(c.v ?? "")}" ${t === "DATE" ? 'type="date"' : ""} aria-label="${esc(f.name)}"></td>`;
  }
  if (f.primary) return `<td class="name"><a href="#entreprises" data-open="${r.id}" style="color:inherit;text-decoration:none">${esc(c.v || "Sans nom")}</a></td>`;
  const conf = c.conf ? `<i class="dot" style="background:${CONF[c.conf][2]}" title="${CONF[c.conf][0]}"></i>` : "";
  const shown = vt(f) === "URL" && c.v ? `<a href="${esc(/^https?:/.test(c.v) ? c.v : "https://" + c.v)}" target="_blank" rel="noopener noreferrer">${esc(String(c.v).replace(/^https?:\/\/(www\.)?/, ""))}</a>` : vt(f) === "SELECT" && c.v ? `<span class="badge ac">${esc(c.v)}</span>` : esc(fmt(f, c.v));
  return `<td class="cell" tabindex="0" data-r="${r.id}" data-f="${f.id}"><div class="v ${!c.v && f.type === "AI" ? "unk" : ""}">${conf}${shown || (f.type === "AI" ? "À rechercher" : "")}${c.lock ? " 🔒" : ""}</div></td>`;
}
function setCell(rid, fid, v, extra = {}) {
  const r = S.rows.find((x) => x.id === rid); const f = S.fields.find((x) => x.id === fid);
  const prev = r.cells[fid] ? { ...r.cells[fid] } : null;
  const c = r.cells[fid] || (r.cells[fid] = {});
  if (String(c.v ?? "") !== String(v)) { c.hist = [...(c.hist || []), { from: c.v ?? "", to: v, at: new Date().toISOString(), why: extra.why || "Modifié par vous" }]; }
  c.v = v; Object.assign(c, extra.cell || {}); if (!extra.cell) delete c.conf;
  save(); return { r, f, prev };
}

    </section>`; }).join("")}

  </div></aside>`);
}

    ${v.dups.length ? `<div class="card"><h2>Doublons</h2><p>${v.dups.map((d) => `Ligne ${d.row} : « ${esc(d.v)} » répète la ligne ${d.first}`).join(" · ")}</p><label class="row"><input type="checkbox" id="skipDup" checked> Garder la première occurrence, ignorer les répétitions</label></div>` : ""}
    ${v.issues.length ? `<div class="tablebox"><table class="t"><tbody>${v.issues.map((x, i) => `<tr><td class="meta">Ligne ${x.row}</td><td>${esc(x.col)}</td><td style="color:var(--bad)">${esc(x.msg)}</td><td><input class="in" data-fix="${i}" placeholder="Valeur corrigée" aria-label="Corriger ligne ${x.row}"></td></tr>`).join("")}</tbody></table></div>` : ""}
    <div class="row" style="justify-content:space-between"><button class="btn ghost" data-act="impback">Retour</button><button class="btn pri" data-act="impgo">Importer</button></div>`;

function loadWorkbook(file) {
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const wb = XLSX.read(new Uint8Array(rd.result), { type: "array", cellDates: true, cellFormula: false, cellHTML: false });
      imp = { file: file.name, wb, sheets: wb.SheetNames, step: 2 }; pickSheet(wb.SheetNames[0]); location.hash = "import"; rerender();
    } catch { toast("Ce fichier n'a pas pu être lu comme un tableur"); }
  };
  rd.readAsArrayBuffer(file);
}
function pickSheet(name) {
  const rows = XLSX.utils.sheet_to_json(imp.wb.Sheets[name], { header: 1, raw: true, defval: null, blankrows: false }).map((r) => r.map((c) => (c instanceof Date ? c.toISOString().slice(0, 10) : c)));
  let h = 0; for (let i = 0; i < Math.min(8, rows.length - 1); i++) { const f = rows[i].filter((c) => c !== null && c !== ""); const w = Math.max(...rows.slice(i + 1, i + 5).map((x) => x.filter((c) => c !== null && c !== "").length), 0); if (f.length && f.every((c) => typeof c === "string") && f.length >= Math.floor(w * 0.6)) { h = i; break; } }
  const head = rows[h] || []; const data = rows.slice(h + 1).slice(0, 2000);
  const width = Math.max(head.length, ...data.slice(0, 30).map((r) => r.length));
  const map = []; for (let c = 0; c < width; c++) { const name = String(head[c] ?? "").trim() || `Colonne ${c + 1}`; const vals = data.map((r) => r[c]); if (vals.every((x) => x === null) && !head[c]) continue; map.push({ idx: c, name, type: infer(vals, name), keep: true, role: "" }); }
  const nm = map.find((m) => /^(société|societe|entreprise|company|employer|employeur|fonds|fund|firm|nom|name)$/i.test(m.name)) || map.find((m) => m.type === "TEXT"); if (nm) nm.role = "name";
  Object.assign(imp, { sheet: name, headerRow: h, data, map, fix: {} });
}
function checkImport() {
  const kept = imp.map.filter((m) => m.keep); const nm = kept.find((m) => m.role === "name");
  if (!nm) return toast("Choisissez la colonne qui contient le nom de l'employeur"), false;
  const issues = [], dups = [], seen = new Map();
  imp.data.forEach((r, i) => { const row = imp.headerRow + 2 + i;
    for (const m of kept) { if (m.role === "name") continue; const v = r[m.idx]; if (v === null || v === "") continue; const err = validate({ type: m.type }, String(v)); if (err) issues.push({ row, col: m.name, msg: err, idx: m.idx, i }); }
    const k = String(r[nm.idx] ?? "").trim().toLowerCase(); if (!k) return; if (seen.has(k)) dups.push({ row, first: seen.get(k), v: r[nm.idx] }); else seen.set(k, row); });
  imp.check = { issues, dups }; imp.step = 3; return true;
}
function commitImport() {
  const kept = imp.map.filter((m) => m.keep); const nm = kept.find((m) => m.role === "name");
  document.querySelectorAll("[data-fix]").forEach((el) => { if (el.value.trim()) { const x = imp.check.issues[+el.dataset.fix]; imp.data[x.i][x.idx] = el.value.trim(); } });
  const skip = $("#skipDup") ? $("#skipDup").checked : true;
  const fmap = new Map(); fmap.set(nm.idx, primary().id);
  for (const m of kept) { if (m === nm) continue; let f = S.fields.find((x) => x.name.toLowerCase() === m.name.toLowerCase()); if (!f) { f = { id: uid(), name: m.name, type: m.type }; S.fields.push(f); } fmap.set(m.idx, f.id); }
  const exist = new Map(S.rows.map((r) => [rowName(r).toLowerCase(), r])); let added = 0, updated = 0, empty = 0; const seen = new Set();
  for (const r of imp.data) { const n = String(r[nm.idx] ?? "").trim(); if (!n) continue; const k = n.toLowerCase(); if (seen.has(k) && skip) continue; seen.add(k);
    let row = skip ? exist.get(k) : null; if (row) updated++; else { row = { id: uid(), cells: {} }; S.rows.push(row); exist.set(k, row); added++; }
    for (const m of kept) { const v = r[m.idx]; if (v === null || v === "") continue; const f = S.fields.find((x) => x.id === fmap.get(m.idx)); if (m !== nm && validate(f, String(v))) { empty++; continue; } if (row.cells[f.id]?.lock) continue; row.cells[f.id] = { ...(row.cells[f.id] || {}), v: String(v) }; } }
  save(); imp = null; toast(`Import terminé : ${added} nouvelles lignes, ${updated} mises à jour${empty ? `, ${empty} valeurs invalides laissées vides` : ""}`); location.hash = "entreprises";
}

function score(c) {

  if (c.city && S.ws.locations.some((l) => c.city.toLowerCase().includes(l.toLowerCase()))) { s += 20; r.push(`Basé à ${c.city}`); }

    <label class="f">Notes (tests, entretiens, retours)<textarea class="in" id="aT">${esc(a.notes)}</textarea></label>
    <div class="row" style="justify-content:space-between">${id ? `<button type="button" class="btn ghost" data-act="delapp" data-a="${id}" style="color:var(--bad)">Supprimer</button>` : "<span></span>"}<span class="row"><button type="button" class="btn ghost" data-close>Annuler</button><button class="btn pri" type="submit">Enregistrer</button></span></div></form>`);
  $("#aForm").onsubmit = (e) => { e.preventDefault(); const v = { role: $("#aR").value.trim(), company: $("#aC").value.trim(), stage: $("#aS").value, deadline: $("#aD").value, url: $("#aU").value.trim(), next: $("#aN").value.trim(), notes: $("#aT").value.trim() }; if (id) Object.assign(S.apps.find((x) => x.id === id), v); else S.apps.push({ id: uid(), ...v }); save(); closeLayer(); toast("Candidature enregistrée"); if (location.hash !== "#candidatures") location.hash = "candidatures"; else rerender(); };
}

// ───────────────────────── Ranking ─────────────────────────
function viewRanking() {
  const numeric = S.fields.filter((f) => ["NUMBER", "CURRENCY", "BOOL"].includes(vt(f)));
  const crit = S.criteria.filter((c) => numeric.some((f) => f.id === c.f)); const total = crit.reduce((a, c) => a + c.w, 0) || 1;
  const ranges = Object.fromEntries(crit.map((c) => { const ns = S.rows.map((r) => valNum(r, c.f)).filter((n) => n != null); return [c.f, [Math.min(...ns), Math.max(...ns)]]; }));
  const res = S.rows.map((r) => { let got = 0, sum = 0; for (const c of crit) { const n = valNum(r, c.f); if (n == null) continue; const [mi, ma] = ranges[c.f]; let x = vt(S.fields.find((f) => f.id === c.f)) === "BOOL" ? n : ma === mi ? 1 : (n - mi) / (ma - mi); if (c.dir === "low") x = 1 - x; got += c.w; sum += x * c.w; } return { r, score: got ? (sum / got) * 100 : null, comp: got / total }; })
    .sort((a, b) => (b.score ?? -1) - (a.score ?? -1));
  return `<div class="head"><div><h1>Classement</h1><p class="sub">Vos critères, vos poids. Une donnée manquante n'est jamais devinée : le classement est alors marqué « provisoire ».</p></div></div>
  <div class="grid g2" style="grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)">
    <div class="card"><h2>Vos critères</h2><p>Seuls les champs Nombre, Montant et Oui/Non peuvent servir.</p>
      ${numeric.length ? crit.map((c, i) => `<div class="sec" style="margin-bottom:8px"><select class="in" data-cf="${i}">${numeric.map((f) => `<option value="${f.id}" ${f.id === c.f ? "selected" : ""}>${esc(f.name)}</option>`).join("")}</select><div class="row"><label class="f" style="flex:1">Poids %<input class="in" type="number" min="0" max="100" data-cw="${i}" value="${c.w}"></label><label class="f" style="flex:1">Mieux si<select class="in" data-cd="${i}"><option value="high" ${c.dir !== "low" ? "selected" : ""}>Plus élevé</option><option value="low" ${c.dir === "low" ? "selected" : ""}>Plus bas</option></select></label><button class="btn sm ghost" data-cx="${i}" aria-label="Retirer">×</button></div></div>`).join("") + `<div class="row" style="justify-content:space-between"><button class="btn sm" data-act="addcrit">+ Critère</button><span class="meta" style="color:${Math.abs(crit.reduce((a, c) => a + c.w, 0) - 100) > 0.5 && crit.length ? "var(--bad)" : ""}">Total ${crit.reduce((a, c) => a + c.w, 0)} %</span></div>` : `<p class="meta">Ajoutez d'abord un champ numérique dans Entreprises (par exemple « Salaire analyste », un Montant), puis renseignez des valeurs.</p>`}
    </div>
    <div class="card"><h2>Résultat</h2><p>Score sur 100 calculé uniquement sur les critères renseignés.</p>
      ${crit.length ? res.map((x, i) => `<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:nowrap"><span class="meta" style="width:18px">${x.score == null ? "–" : i + 1}</span><b style="width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(rowName(x.r))}</b><span class="bar"><i style="width:${x.score ?? 0}%;opacity:${x.comp < 1 ? 0.55 : 1}"></i></span><span style="width:30px;text-align:right;font-variant-numeric:tabular-nums">${x.score == null ? "–" : Math.round(x.score)}</span>${x.score == null ? '<span class="badge">Pas de données</span>' : x.comp < 1 ? `<span class="badge warn">Provisoire · ${Math.round(x.comp * 100)} %</span>` : '<span class="badge good">Complet</span>'}</div>`).join("") : '<p class="meta">Ajoutez un critère pour voir le classement.</p>'}
    </div></div>`;
}
const valNum = (r, fid) => { const f = S.fields.find((x) => x.id === fid); const v = r.cells[fid]?.v; if (v == null || v === "") return null; if (vt(f) === "BOOL") return /^(oui|yes|true|1|x)$/i.test(v) ? 1 : 0; return num(v); };

// ───────────────────────── Layer & events ─────────────────────────
function layer(html) { $("#layer").innerHTML = html; const first = $("#layer input, #layer select, #layer textarea, #layer button"); first && first.focus(); }
function closeLayer() { $("#layer").innerHTML = ""; }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if ($("#layer").innerHTML) closeLayer(); else if (editing) { editing = null; rerender(); } } });
$("#layer").addEventListener("click", (e) => { if (e.target.closest("[data-close]")) return closeLayer(); const t = e.target.closest("[data-act]"); if (t) act(t.dataset.act, t.dataset, t); });
$("#menuBtn").onclick = () => $("#side").classList.toggle("open");
$("#resetBtn").onclick = (e) => { const b = e.currentTarget; if (b.dataset.armed) { S = seed(); save(); imp = null; delete b.dataset.armed; b.textContent = "Réinitialiser la démo"; toast("Démo réinitialisée"); location.hash = "accueil"; route(); } else { b.dataset.armed = "1"; b.textContent = "Confirmer : tout effacer ?"; setTimeout(() => { delete b.dataset.armed; b.textContent = "Réinitialiser la démo"; }, 4000); } };

function bind(v) {
  const view = $("#view");
  view.onclick = (e) => {
    const t = e.target.closest("[data-act],[data-open],[data-sort],[data-contact],[data-app],[data-cx]"); if (!t) return;
    if (t.dataset.open) { e.preventDefault(); return openRow(t.dataset.open); }
    if (t.dataset.sort) { sort = sort?.id === t.dataset.sort ? (sort.dir > 0 ? { id: sort.id, dir: -1 } : null) : { id: t.dataset.sort, dir: 1 }; return rerender(); }
    if (t.dataset.contact && !e.target.closest("select")) return openContact(t.dataset.contact);
    if (t.dataset.app && !e.target.closest("select")) return appForm(t.dataset.app);
    if (t.dataset.cx !== undefined) { S.criteria.splice(+t.dataset.cx, 1); save(); return rerender(); }
    act(t.dataset.act, t.dataset, t);
  };
  view.ondblclick = (e) => { const td = e.target.closest("td.cell"); if (td) startEdit(td.dataset.r, td.dataset.f); };
  view.onkeydown = (e) => { const td = e.target.closest("td.cell"); if (td && e.key === "Enter") { e.preventDefault(); startEdit(td.dataset.r, td.dataset.f); } };
  view.onchange = (e) => {
    const t = e.target;
    if (t.dataset.cstage) { S.contacts.find((c) => c.id === t.dataset.cstage).stage = t.value; save(); rerender(); }
    if (t.dataset.astage) { S.apps.find((a) => a.id === t.dataset.astage).stage = t.value; save(); rerender(); }
    if (t.dataset.cf !== undefined) { S.criteria[+t.dataset.cf].f = t.value; save(); rerender(); }
    if (t.dataset.cw !== undefined) { S.criteria[+t.dataset.cw].w = Math.max(0, Math.min(100, +t.value || 0)); save(); rerender(); }
    if (t.dataset.cd !== undefined) { S.criteria[+t.dataset.cd].dir = t.value; save(); rerender(); }
    if (imp && t.dataset.mk !== undefined) imp.map[+t.dataset.mk].keep = t.checked;
    if (imp && t.dataset.mt !== undefined) imp.map[+t.dataset.mt].type = t.value;
    if (imp && t.dataset.mr !== undefined) { imp.map.forEach((m) => (m.role = "")); imp.map[+t.dataset.mr].role = t.value; rerender(); }
    if (imp && t.dataset.mn !== undefined) imp.map[+t.dataset.mn].name = t.value.trim() || imp.map[+t.dataset.mn].name;
    if (t.id === "sheet") { pickSheet(t.value); rerender(); }
    if (t.id === "file" && t.files[0]) loadWorkbook(t.files[0]);
  };
  if (v === "entreprises") {
    const q = $("#q"); q.oninput = () => { search = q.value; const pos = q.selectionStart; rerender(); const n = $("#q"); n.focus(); n.setSelectionRange(pos, pos); };
    $("#addRow").onsubmit = (e) => { e.preventDefault(); const n = $("#newRow").value.trim(); if (!n) return; if (S.rows.some((r) => rowName(r).toLowerCase() === n.toLowerCase())) return toast("Cette entreprise est déjà dans le tableau"); S.rows.push({ id: uid(), cells: { [primary().id]: { v: n } } }); save(); toast(`${n} ajoutée`); rerender(); };
    const ce = $("#cellEdit");
    if (ce) { ce.focus(); ce.select?.(); const { r, f } = editing; let done = false;
      const commit = () => { if (done) return; done = true; const val = ce.value.trim(); const err = validate(S.fields.find((x) => x.id === f), val); editing = null; if (err) { toast(err); return rerender(); } const row = S.rows.find((x) => x.id === r); const before = row.cells[f]?.v ?? ""; if (String(before) === val) return rerender(); const fld = S.fields.find((x) => x.id === f); setCell(r, f, val); rerender(); toast(`${fld.name} mis à jour`, () => { setCell(r, f, before, { why: "Annulation" }); rerender(); }); };
      ce.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); commit(); } if (e.key === "Escape") { done = true; editing = null; rerender(); } }; ce.onblur = commit; }
  }
  if (v === "import" && !imp) { const d = $("#drop"); d.ondragover = (e) => { e.preventDefault(); d.classList.add("over"); }; d.ondragleave = () => d.classList.remove("over"); d.ondrop = (e) => { e.preventDefault(); d.classList.remove("over"); if (e.dataTransfer.files[0]) loadWorkbook(e.dataTransfer.files[0]); }; }
}
function startEdit(r, f) { const row = S.rows.find((x) => x.id === r); if (row.cells[f]?.lock) return toast("Valeur confirmée : déverrouillez-la depuis la fiche pour la modifier"); editing = { r, f }; rerender(); }
function act(a, d, el) {
  if (a === "addfield") return fieldForm();
  if (a === "research") return researchModal(d.scope, d.r);
  if (a === "evid") return evidenceForm(d.r, d.f);
  if (a === "lock") { const r = S.rows.find((x) => x.id === d.r); const c = r.cells[d.f] || (r.cells[d.f] = {}); c.lock = !c.lock; save(); toast(c.lock ? "Valeur confirmée : elle ne sera jamais écrasée" : "Valeur déverrouillée"); rerender(); return openRow(d.r); }
  if (a === "delrow") { const b = el; if (!b.dataset.armed) { b.dataset.armed = 1; b.textContent = "Confirmer la suppression"; return; } S.rows = S.rows.filter((x) => x.id !== d.r); save(); closeLayer(); toast("Entreprise supprimée"); return rerender(); }
  if (a === "copycsv") { const q = (s) => `"${String(s ?? "").replace(/"/g, '""').replace(/^([=+\-@])/, "'$1")}"`; return copy([S.fields.map((f) => q(f.name)).join(","), ...S.rows.map((r) => S.fields.map((f) => q(r.cells[f.id]?.v)).join(","))].join("\n")); }
  if (a === "newcontact") return contactForm(d.company || "");
  if (a === "delcontact") { const b = el; if (!b.dataset.armed) { b.dataset.armed = 1; b.textContent = "Confirmer la suppression"; return; } S.contacts = S.contacts.filter((c) => c.id !== d.c); save(); closeLayer(); return rerender(); }
  if (a === "newapp") return appForm(null, d.company || "");
  if (a === "delapp") { const b = el; if (!b.dataset.armed) { b.dataset.armed = 1; b.textContent = "Confirmer la suppression"; return; } S.apps = S.apps.filter((x) => x.id !== d.a); save(); closeLayer(); return rerender(); }
  if (a === "addcrit") { const f = S.fields.find((x) => ["NUMBER", "CURRENCY", "BOOL"].includes(vt(x))); S.criteria.push({ f: f.id, w: Math.max(0, 100 - S.criteria.reduce((x, c) => x + c.w, 0)), dir: "high" }); save(); return rerender(); }
  if (a === "discover") return researchModal("table");
  if (a === "editws") {
    layer(`<div class="scrim" data-close></div><form class="modal" id="wForm" role="dialog" aria-label="Objectif"><div class="row" style="justify-content:space-between"><h2>Votre objectif</h2><button type="button" class="x" data-close aria-label="Fermer">×</button></div>
      <label class="f">Nom de l'espace<input class="in" id="wN" value="${esc(S.ws.name)}"></label><label class="f">Objectif<textarea class="in" id="wO">${esc(S.ws.objective)}</textarea></label>
      <div class="grid" style="grid-template-columns:1fr 1fr"><label class="f">Villes visées<input class="in" id="wL" value="${esc(S.ws.locations.join(", "))}"></label><label class="f">Postes visés<input class="in" id="wR" value="${esc(S.ws.roles.join(", "))}"></label></div>
      <div class="row" style="justify-content:flex-end"><button class="btn pri" type="submit">Enregistrer</button></div></form>`);
    $("#wForm").onsubmit = (e) => { e.preventDefault(); const sp = (s) => s.split(",").map((x) => x.trim()).filter(Boolean); S.ws = { name: $("#wN").value.trim() || S.ws.name, objective: $("#wO").value.trim(), locations: sp($("#wL").value), roles: sp($("#wR").value) }; save(); closeLayer(); rerender(); };
  }
  if (a === "impcancel") { imp = null; return rerender(); }
  if (a === "impcheck") { if (checkImport()) rerender(); return; }
  if (a === "impback") { imp.step = 2; return rerender(); }
  if (a === "impgo") return commitImport();
}
window.addEventListener("hashchange", route);
route();
</script>
