<title>Careerly</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: "dossier de recherche" — forest-green rail + calm paper canvas; evidence marked in honey like a highlighter */
:root {
  --canvas: #f4f6f3; --surface: #ffffff; --sunk: #eef1ec; --ink: #13201a; --ink-2: #4b5a52; --ink-3: #7c8a82;
  --rule: #e0e5df; --rule-2: #cfd6cf;
  --rail: #0f2a22; --rail-2: #173a2f; --rail-ink: #e6efe9; --rail-mute: #94ada2;
  --accent: #12795a; --accent-ink: #ffffff; --accent-soft: #e2f1ea; --accent-deep: #0b5a42;
  --honey: #e3a33a; --honey-soft: #fbf0db; --honey-ink: #7a520f;
  --good: #1d8a5a; --warn: #b8791d; --bad: #c8433a; --s1: #2a78d6; --s2: #eb6834;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Geist", "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r: 12px; --r-sm: 8px;
  --shadow: 0 1px 0 rgb(19 32 26 / .04), 0 1px 3px rgb(19 32 26 / .06);
  --shadow-lg: 0 18px 50px -12px rgb(15 42 34 / .35);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --canvas: #0d1512; --surface: #131e19; --sunk: #0f1915; --ink: #e8efea; --ink-2: #a9b8b0; --ink-3: #7d8d85;
  --rule: #22312a; --rule-2: #2d3f36; --rail: #08110d; --rail-2: #12231c; --rail-ink: #e6efe9; --rail-mute: #7f9a8e;
  --accent: #3fbf8f; --accent-ink: #06130e; --accent-soft: #163a2d; --accent-deep: #7fdcb7;
  --honey: #f0b552; --honey-soft: #33280f; --honey-ink: #f5cf8a;
  --good: #4cc38a; --warn: #f0b040; --bad: #ef7268; --s1: #3987e5; --s2: #d95926;
  --dossier: #15302a; --dossier-rule: #24463b;
  --shadow: 0 1px 0 rgb(0 0 0 / .3); --shadow-lg: 0 18px 50px -12px rgb(0 0 0 / .6); color-scheme: dark; } }
:root[data-theme="dark"] {
  --canvas: #0d1512; --surface: #131e19; --sunk: #0f1915; --ink: #e8efea; --ink-2: #a9b8b0; --ink-3: #7d8d85;
  --rule: #22312a; --rule-2: #2d3f36; --rail: #08110d; --rail-2: #12231c; --rail-ink: #e6efe9; --rail-mute: #7f9a8e;
  --accent: #3fbf8f; --accent-ink: #06130e; --accent-soft: #163a2d; --accent-deep: #7fdcb7;
  --honey: #f0b552; --honey-soft: #33280f; --honey-ink: #f5cf8a;
  --good: #4cc38a; --warn: #f0b040; --bad: #ef7268; --s1: #3987e5; --s2: #d95926;
  --dossier: #15302a; --dossier-rule: #24463b;
  --shadow: 0 1px 0 rgb(0 0 0 / .3); --shadow-lg: 0 18px 50px -12px rgb(0 0 0 / .6); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--canvas); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ── Shell ── */
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--rail); color: var(--rail-ink); padding: 18px 14px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; }
.logo { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 750; font-size: 19px; letter-spacing: -0.02em; padding: 0 6px; }
.logo i { width: 28px; height: 28px; border-radius: 8px; background: var(--honey); display: grid; place-items: center; }
.logo small { font-family: var(--body); font-weight: 400; font-size: 11px; color: var(--rail-mute); letter-spacing: .02em; display: block; margin-top: -2px; }
.ws { background: var(--rail-2); border-radius: 10px; padding: 11px 12px; display: grid; gap: 3px; }
.ws .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--rail-mute); }
.ws b { font-weight: 600; font-size: 13.5px; line-height: 1.3; }
.ws small { color: var(--rail-mute); font-size: 12px; }
nav { display: flex; flex-direction: column; gap: 1px; }
nav .grp { font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--rail-mute); padding: 12px 10px 6px; }
nav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; color: var(--rail-mute); text-decoration: none; font-size: 13.5px; font-weight: 500; transition: background .12s, color .12s; }
nav a:hover { background: var(--rail-2); color: var(--rail-ink); }
nav a[aria-current="page"] { background: var(--rail-2); color: #fff; box-shadow: inset 3px 0 0 var(--honey); }
nav svg { width: 17px; height: 17px; flex: none; }
nav a .cnt { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--rail-mute); }
.side .foot { margin-top: auto; display: grid; gap: 8px; font-size: 11.5px; color: var(--rail-mute); padding: 0 4px; }
.side .foot button { background: transparent; border: 1px solid var(--rail-2); color: var(--rail-ink); border-radius: 8px; height: 32px; cursor: pointer; font-size: 12.5px; }
.side .foot button:hover { background: var(--rail-2); }
main { min-width: 0; padding-block: 0 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 0 6px; font-size: 12.5px; color: var(--ink-3); }
.crumb b { color: var(--ink-2); font-weight: 500; }
.demo-chip { white-space: nowrap; flex: none; display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--rule-2); background: var(--surface); border-radius: 99px; padding: 4px 11px 4px 9px; color: var(--ink-2); cursor: help; position: relative; }
.demo-chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--honey); box-shadow: 0 0 0 3px var(--honey-soft); }
.demo-chip:hover .tip, .demo-chip:focus .tip { display: block; }
.tip { display: none; position: absolute; right: 0; top: calc(100% + 8px); width: 300px; background: var(--ink); color: var(--canvas); border-radius: 10px; padding: 10px 12px; font-size: 12.5px; line-height: 1.45; z-index: 20; box-shadow: var(--shadow-lg); }
.wrap { max-width: 1200px; margin: 0 auto; display: grid; gap: 22px; padding-top: 10px; }

/* ── Type ── */
h1 { font-family: var(--display); font-weight: 650; font-size: clamp(24px, 3vw, 32px); letter-spacing: -0.025em; line-height: 1.1; margin: 0; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 650; font-size: 16px; letter-spacing: -0.01em; margin: 0; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); font-weight: 600; }
.sub { color: var(--ink-2); margin: 8px 0 0; max-width: 66ch; font-size: 14.5px; }
.meta { color: var(--ink-3); font-size: 12.5px; }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

/* ── Surfaces ── */
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: 18px 20px; min-width: 0; box-shadow: var(--shadow); }
.card > h2 + p, .card .lead { color: var(--ink-3); font-size: 12.5px; margin: 4px 0 14px; }
.sec { border: 1px solid var(--rule); background: var(--surface); border-radius: var(--r); padding: 14px; display: grid; gap: 9px; }
.sec .lab { font-size: 12px; color: var(--ink-3); font-weight: 600; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.empty { border: 1.5px dashed var(--rule-2); border-radius: var(--r); padding: 40px 20px; text-align: center; color: var(--ink-3); display: grid; justify-items: center; gap: 6px; background: var(--surface); }
.empty svg { width: 46px; height: 46px; color: var(--accent); margin-bottom: 4px; }
.empty b { color: var(--ink); font-family: var(--display); font-size: 17px; font-weight: 650; }
.empty p { margin: 0; max-width: 46ch; }

/* ── Controls ── */
.btn { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--rule-2); background: var(--surface); cursor: pointer; font-weight: 550; font-size: 13px; white-space: nowrap; color: var(--ink); transition: background .12s, border-color .12s, transform .06s; text-decoration: none; }
.btn:hover { background: var(--sunk); border-color: var(--ink-3); }
.btn:active { transform: translateY(1px); }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: transparent; box-shadow: 0 1px 0 rgb(0 0 0 / .08), inset 0 1px 0 rgb(255 255 255 / .15); }
.btn.pri:hover { background: var(--accent-deep); color: var(--accent-ink); }
:root[data-theme="dark"] .btn.pri:hover { background: var(--accent); filter: brightness(1.1); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--sunk); color: var(--ink); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 12.5px; border-radius: 8px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn svg { width: 15px; height: 15px; }
input.in, select.in, textarea.in { width: 100%; border: 1px solid var(--rule-2); background: var(--surface); border-radius: var(--r-sm); padding: 8px 11px; min-height: 36px; transition: border-color .12s, box-shadow .12s; }
input.in:focus, select.in:focus, textarea.in:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.in { min-height: 76px; resize: vertical; }
label.f { display: grid; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
label.f span.h { font-weight: 400; color: var(--ink-3); font-size: 12px; }
.search { position: relative; max-width: 300px; flex: 1; }
.search svg { position: absolute; left: 11px; top: 50%; translate: 0 -50%; width: 15px; height: 15px; color: var(--ink-3); }
.search input { padding-left: 34px; }

/* ── Chips ── */
.badge { display: inline-flex; align-items: center; gap: 5px; border-radius: 99px; padding: 2px 9px; font-size: 11.5px; font-weight: 600; background: var(--sunk); color: var(--ink-2); white-space: nowrap; line-height: 1.6; }
.badge.ac { background: var(--accent-soft); color: var(--accent-deep); }
.badge.good { color: var(--good); background: color-mix(in srgb, var(--good) 13%, transparent); }
.badge.warn { color: var(--honey-ink); background: var(--honey-soft); }
.badge.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); }
.badge.out { background: transparent; border: 1px solid var(--rule-2); }
.badge.info { color: var(--s1); background: color-mix(in srgb, var(--s1) 12%, transparent); }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
.mono-av { width: 26px; height: 26px; border-radius: 7px; display: inline-grid; place-items: center; font-family: var(--display); font-weight: 750; font-size: 11px; letter-spacing: -0.02em; color: #fff; flex: none; }

/* ── Table ── */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.tablebox { overflow: auto; border: 1px solid var(--rule); border-radius: var(--r); background: var(--surface); max-height: 66vh; box-shadow: var(--shadow); }
table.t { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13.5px; }
.t th { position: sticky; top: 0; background: var(--sunk); text-align: left; font-weight: 600; color: var(--ink-3); font-size: 11.5px; letter-spacing: .02em; padding: 10px 12px; border-bottom: 1px solid var(--rule); white-space: nowrap; cursor: pointer; user-select: none; z-index: 2; }
.t th:hover { color: var(--ink); }
.t th .ty { font-family: var(--mono); font-size: 10px; color: var(--ink-3); opacity: .8; margin-left: 4px; font-weight: 400; }
.t th.ai { color: var(--accent-deep); }
.t td { padding: 9px 12px; border-bottom: 1px solid var(--rule); vertical-align: middle; min-width: 150px; max-width: 300px; }
.t th:first-child, .t td:first-child { position: sticky; left: 0; background: var(--surface); z-index: 1; box-shadow: 1px 0 0 var(--rule); }
.t th:first-child { background: var(--sunk); z-index: 3; }
.t tbody tr:hover td { background: color-mix(in srgb, var(--accent-soft) 45%, var(--surface)); }
.t td.name { font-weight: 600; min-width: 200px; }
.t td.name a { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; }
.t td.name a:hover span { text-decoration: underline; text-underline-offset: 3px; }
.t td.cell { cursor: text; }
.t td .v { display: flex; gap: 7px; align-items: center; overflow: hidden; white-space: nowrap; }
.t td .v > span.txt { overflow: hidden; text-overflow: ellipsis; }
.t td .v.unk { color: var(--ink-3); }
.t td .v.unk .txt { font-size: 12.5px; border: 1px dashed var(--rule-2); border-radius: 99px; padding: 1px 9px; }
.t td .src { font-family: var(--mono); font-size: 10.5px; color: var(--honey-ink); background: var(--honey-soft); border-radius: 5px; padding: 1px 5px; }
.t td a.lnk { font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); text-decoration: none; }
.t td a.lnk:hover { color: var(--accent); text-decoration: underline; }
.t tr:last-child td { border-bottom: 0; }
.t td input.in { min-height: 30px; padding: 4px 8px; }
.addrow { display: flex; gap: 8px; max-width: 360px; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--ink-3); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }

/* ── Panel & modal ── */
.scrim { position: fixed; inset: 0; background: rgb(8 20 15 / .42); backdrop-filter: blur(2px); z-index: 40; animation: fade .16s ease-out; }
.panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(580px, 100%); background: var(--canvas); z-index: 41; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); animation: slide .2s cubic-bezier(.2,.8,.2,1); padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.panel header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 20px 22px 16px; background: var(--surface); border-bottom: 1px solid var(--rule); }
.panel header .id { display: flex; gap: 12px; align-items: center; }
.panel header .mono-av { width: 40px; height: 40px; border-radius: 10px; font-size: 15px; }
.panel header h2 { font-size: 20px; }
.panel .body { overflow: auto; padding: 18px 22px 28px; display: grid; gap: 12px; align-content: start; }
.modal { position: fixed; z-index: 41; left: 50%; top: 50%; translate: -50% -50%; width: min(640px, calc(100% - 32px)); max-height: calc(100% - 40px); overflow: auto; background: var(--surface); border-radius: 16px; padding: 22px; display: grid; gap: 16px; box-shadow: var(--shadow-lg); animation: pop .18s cubic-bezier(.2,.8,.2,1); }
.modal h2 { font-size: 19px; }
.x { border: 0; background: transparent; cursor: pointer; width: 32px; height: 32px; border-radius: 8px; color: var(--ink-3); font-size: 20px; line-height: 1; flex: none; }
.x:hover { background: var(--sunk); color: var(--ink); }
.field-v { font-size: 15px; font-weight: 500; }
.field-v.big { font-family: var(--display); font-size: 22px; font-weight: 650; letter-spacing: -0.01em; }
.ev { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 11px 12px; font-size: 13px; display: grid; gap: 6px; }
.ev .u { font-family: var(--mono); font-size: 12px; display: flex; align-items: center; gap: 6px; }
.ev blockquote { margin: 0; padding: 2px 0 2px 11px; border-left: 3px solid var(--honey); background: linear-gradient(90deg, var(--honey-soft), transparent 80%); border-radius: 0 6px 6px 0; }
.consigne { font-size: 12.5px; color: var(--ink-2); background: var(--sunk); border-radius: 8px; padding: 8px 10px; }
.consigne b { font-weight: 600; color: var(--ink); }
details summary { cursor: pointer; color: var(--ink-3); font-size: 12.5px; }
.hist { display: grid; gap: 4px; margin-top: 6px; padding-left: 10px; border-left: 1px solid var(--rule-2); }

.toast { position: fixed; z-index: 60; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; translate: -50% 0; background: var(--ink); color: var(--canvas); border-radius: 99px; padding: 9px 10px 9px 18px; font-size: 13px; display: flex; gap: 14px; align-items: center; box-shadow: var(--shadow-lg); animation: pop .18s ease-out; max-width: calc(100% - 32px); }
.toast button { background: var(--honey); color: #1b1305; border: 0; border-radius: 99px; padding: 4px 12px; cursor: pointer; font-weight: 600; font-size: 12.5px; }
.toast:not(:has(button)) { padding-right: 18px; }

/* ── Boards ── */
.board { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x proximity; }
.col { flex: 0 0 248px; background: var(--sunk); border-radius: var(--r); padding: 10px; display: grid; gap: 8px; align-content: start; min-height: 140px; scroll-snap-align: start; }
.col h3 { margin: 0; font-size: 12px; color: var(--ink-2); padding: 2px 4px 4px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
.col h3 .num { font-size: 11px; background: var(--surface); border-radius: 99px; padding: 0 8px; color: var(--ink-3); }
.col.empty-col { opacity: .7; }
.kcard { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 11px 12px; display: grid; gap: 7px; cursor: pointer; box-shadow: var(--shadow); transition: border-color .12s, transform .12s; }
.kcard:hover { border-color: var(--accent); transform: translateY(-1px); }
.kcard .top { display: flex; gap: 9px; align-items: center; }
.kcard b { font-size: 13.5px; line-height: 1.25; }
.kcard select { font-size: 12px; padding: 3px 6px; border-radius: 7px; border: 1px solid var(--rule-2); background: var(--sunk); }

/* ── Home ── */
.dossier { background: var(--dossier, var(--rail)); border: 1px solid var(--dossier-rule, transparent); color: var(--rail-ink); border-radius: 18px; padding: 28px 30px; display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 28px; position: relative; overflow: hidden; }
.dossier::after { content: ""; position: absolute; right: -60px; top: -60px; width: 260px; height: 260px; border-radius: 50%; border: 36px solid rgb(227 163 58 / .12); pointer-events: none; }
.dossier .eyebrow { color: var(--rail-mute); }
.dossier h1 { color: #fff; margin-top: 6px; }
.dossier q { display: block; margin-top: 14px; font-size: 15.5px; line-height: 1.55; color: #cfe0d7; quotes: "« " " »"; max-width: 60ch; }
.dossier .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 16px; }
.dossier .tags span { border: 1px solid rgb(255 255 255 / .18); border-radius: 99px; padding: 3px 11px; font-size: 12px; color: #e6efe9; }
.dossier .tags span.r { background: var(--honey); color: #1b1305; border-color: transparent; font-weight: 600; }
.figs { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: rgb(255 255 255 / .1); border-radius: 12px; overflow: hidden; align-self: center; position: relative; z-index: 1; }
.figs a { background: var(--dossier, var(--rail)); padding: 14px 16px; text-decoration: none; color: inherit; display: grid; gap: 2px; }
.figs a:hover { background: var(--rail-2); }
.figs b { font-family: var(--display); font-size: 28px; font-weight: 650; letter-spacing: -0.02em; color: #fff; }
.figs span { font-size: 12px; color: var(--rail-mute); }
.nba { display: grid; gap: 4px; }
.nba a { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 14px 12px 0; border-radius: 10px; text-decoration: none; color: inherit; border: 1px solid transparent; }
.nba a:hover { background: var(--sunk); }
.nba a i { align-self: stretch; border-radius: 4px; background: var(--rule-2); }
.nba a.k-deadline i { background: var(--bad); } .nba a.k-follow i { background: var(--honey); } .nba a.k-contact i { background: var(--s1); } .nba a.k-research i { background: var(--accent); } .nba a.k-setup i { background: var(--rule-2); }
.nba b { font-weight: 600; display: block; }
.nba small { display: block; color: var(--ink-3); font-size: 12.5px; margin-top: 2px; }

function score(c) {
  const r = []; let s = 0; const roleW = S.ws.roles.join(" ").toLowerCase().split(/\W+/).filter((w) => w.length > 3);

function draft(c, purpose, tone) {

function agendaItems() {

  for (const c of S.contacts) for (const n of c.log || []) if (n.follow && !n.done) out.push({ d: n.follow, k: "Relance", tone: "warn", t: `Relancer ${c.name}`, s: c.company, h: "#reseau", contact: c.id });

}

// ───────────────────────── Ranking ─────────────────────────
function viewRanking() {
  const numeric = S.fields.filter((f) => ["NUMBER", "CURRENCY", "BOOL"].includes(vt(f)));
  const crit = S.criteria.filter((c) => numeric.some((f) => f.id === c.f)); const total = crit.reduce((a, c) => a + c.w, 0) || 1;
  const ranges = Object.fromEntries(crit.map((c) => { const ns = S.rows.map((r) => valNum(r, c.f)).filter((n) => n != null); return [c.f, [Math.min(...ns), Math.max(...ns)]]; }));
  const res = S.rows.map((r) => { let got = 0, sum = 0; for (const c of crit) { const n = valNum(r, c.f); if (n == null) continue; const [mi, ma] = ranges[c.f]; let x = vt(S.fields.find((f) => f.id === c.f)) === "BOOL" ? n : ma === mi ? 1 : (n - mi) / (ma - mi); if (c.dir === "low") x = 1 - x; got += c.w; sum += x * c.w; } return { r, score: got ? (sum / got) * 100 : null, comp: got / total }; })
    .sort((a, b) => (b.score ?? -1) - (a.score ?? -1));
  return `<div class="head"><div><span class="eyebrow">Vos priorités</span><h1>Classement</h1><p class="sub">Vos critères, vos poids. Une donnée manquante n'est jamais devinée : le classement est alors marqué « provisoire ».</p></div></div>
  <div class="grid g2" style="grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)">
    <div class="card"><h2>Vos critères</h2><p>Seuls les champs Nombre, Montant et Oui/Non peuvent servir.</p>
      ${numeric.length ? crit.map((c, i) => `<div class="sec" style="margin-bottom:8px"><select class="in" data-cf="${i}">${numeric.map((f) => `<option value="${f.id}" ${f.id === c.f ? "selected" : ""}>${esc(f.name)}</option>`).join("")}</select><div class="row"><label class="f" style="flex:1">Poids %<input class="in" type="number" min="0" max="100" data-cw="${i}" value="${c.w}"></label><label class="f" style="flex:1">Mieux si<select class="in" data-cd="${i}"><option value="high" ${c.dir !== "low" ? "selected" : ""}>Plus élevé</option><option value="low" ${c.dir === "low" ? "selected" : ""}>Plus bas</option></select></label><button class="btn sm ghost" data-cx="${i}" aria-label="Retirer">×</button></div></div>`).join("") + `<div class="row" style="justify-content:space-between"><button class="btn sm" data-act="addcrit">+ Critère</button><span class="meta" style="color:${Math.abs(crit.reduce((a, c) => a + c.w, 0) - 100) > 0.5 && crit.length ? "var(--bad)" : ""}">Total ${crit.reduce((a, c) => a + c.w, 0)} %</span></div>` : `<p class="meta">Ajoutez d'abord un champ numérique dans Entreprises (par exemple « Salaire analyste », un Montant), puis renseignez des valeurs.</p>`}
    </div>
    <div class="card"><h2>Résultat</h2><p>Score sur 100 calculé uniquement sur les critères renseignés.</p>
      ${crit.length ? res.map((x, i) => `<div class="rank-row"><span class="meta num">${x.score == null ? "–" : i + 1}</span><span class="who">${av(rowName(x.r), 22)}<span>${esc(rowName(x.r))}</span></span><span class="bar"><i style="width:${x.score ?? 0}%;opacity:${x.comp < 1 ? 0.55 : 1}"></i></span><span class="num" style="text-align:right">${x.score == null ? "–" : Math.round(x.score)}</span>${x.score == null ? '<span class="badge">Pas de données</span>' : x.comp < 1 ? `<span class="badge warn">Provisoire · ${Math.round(x.comp * 100)} %</span>` : '<span class="badge good">Complet</span>'}</div>`).join("") : '<p class="meta">Ajoutez un critère pour voir le classement.</p>'}
    </div></div>`;
}
const valNum = (r, fid) => { const f = S.fields.find((x) => x.id === fid); const v = r.cells[fid]?.v; if (v == null || v === "") return null; if (vt(f) === "BOOL") return /^(oui|yes|true|1|x)$/i.test(v) ? 1 : 0; return num(v); };

// ───────────────────────── Layer & events ─────────────────────────
function layer(html) { $("#layer").innerHTML = html; const first = $("#layer input, #layer select, #layer textarea, #layer button"); first && first.focus(); }
function closeLayer() { $("#layer").innerHTML = ""; }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if ($("#layer").innerHTML) closeLayer(); else if (editing) { editing = null; rerender(); } } });
$("#layer").addEventListener("click", (e) => {
  if (e.target.closest("[data-close]")) return closeLayer();
  const pr = e.target.closest("[data-prio]"); if (pr) { const r = S.rows.find((x) => x.id === pr.dataset.r); r.prio = pr.dataset.prio || undefined; save(); toast(pr.dataset.prio ? `Priorité : ${PRIO[pr.dataset.prio][0]}` : "Priorité retirée"); rerender(); return openRow(r.id); }
  const pal = e.target.closest("[data-go]"); if (pal) return palGo(+pal.dataset.go);
  const t = e.target.closest("[data-act]"); if (t) act(t.dataset.act, t.dataset, t);
});
$("#layer").addEventListener("change", (e) => {
  if (e.target.id === "rowNotes") { const r = S.rows.find((x) => x.id === e.target.dataset.r); r.notes = e.target.value.slice(0, 5000); save(); toast("Notes enregistrées"); }
  if (e.target.dataset.prep !== undefined) { const n = document.querySelectorAll("[data-prep]:checked").length; $("#prepPct").textContent = Math.round((n / PREP.length) * 100); }
});
$("#themeBtn").onclick = () => { const root = document.documentElement; const dark = root.dataset.theme === "dark" || (!root.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches); root.dataset.theme = dark ? "light" : "dark"; try { localStorage.setItem(KEY + "-theme", root.dataset.theme); } catch {} shell(); };
try { const th = localStorage.getItem(KEY + "-theme"); if (th) document.documentElement.dataset.theme = th; } catch {}

// ── Recherche rapide (Ctrl+K) ──
let palHits = [], palSel = 0;
function palSearch(q) {
  const n = q.trim().toLowerCase(); const hits = [];
  for (const [k, l] of NAV) if (!n || l.toLowerCase().includes(n)) hits.push({ k: "Page", t: l, go: () => (location.hash = k) });
  if (n.length >= 1) {
    for (const r of S.rows) if (rowName(r).toLowerCase().includes(n)) hits.unshift({ k: "Entreprise", t: rowName(r), s: r.cells[S.fields[1]?.id]?.v, go: () => { location.hash = "entreprises"; setTimeout(() => openRow(r.id), 30); } });
    for (const c of S.contacts) if (`${c.name} ${c.company} ${c.title}`.toLowerCase().includes(n)) hits.unshift({ k: "Contact", t: c.name, s: [c.title, c.company].filter(Boolean).join(" · "), go: () => { location.hash = "reseau"; setTimeout(() => openContact(c.id), 30); } });
    for (const a of S.apps) if (`${a.role} ${a.company}`.toLowerCase().includes(n)) hits.unshift({ k: "Candidature", t: a.role, s: a.company, go: () => { location.hash = "candidatures"; setTimeout(() => appForm(a.id), 30); } });
  }
  palHits = hits.slice(0, 12); palSel = 0; drawPal();
}
function drawPal() { const ul = $("#palList"); if (!ul) return; ul.innerHTML = palHits.length ? palHits.map((h, i) => `<li><button type="button" data-go="${i}" aria-selected="${i === palSel}">${h.k === "Page" ? "" : av(h.t, 24)}<span class="t"><b>${esc(h.t)}</b>${h.s ? `<small>${esc(h.s)}</small>` : ""}</span><span class="badge out">${h.k}</span></button></li>`).join("") : '<li class="meta" style="padding:14px;text-align:center">Aucun résultat</li>'; }
function palGo(i) { const h = palHits[i]; if (!h) return; closeLayer(); h.go(); }
function openPalette() {
  layer(`<div class="scrim" data-close></div><div class="pal" role="dialog" aria-label="Recherche rapide"><div class="inp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18" style="color:var(--ink-3)"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg><input id="palIn" placeholder="Entreprise, contact, candidature, page…" aria-label="Rechercher" autocomplete="off"></div><ul id="palList" role="listbox"></ul><div class="hint"><span><kbd>↑↓</kbd> naviguer</span><span><kbd>Entrée</kbd> ouvrir</span><span><kbd>Échap</kbd> fermer</span></div></div>`);
  const inp = $("#palIn"); inp.focus(); palSearch("");
  inp.oninput = () => palSearch(inp.value);
  inp.onkeydown = (e) => { if (e.key === "ArrowDown") { e.preventDefault(); palSel = Math.min(palHits.length - 1, palSel + 1); drawPal(); } if (e.key === "ArrowUp") { e.preventDefault(); palSel = Math.max(0, palSel - 1); drawPal(); } if (e.key === "Enter") { e.preventDefault(); palGo(palSel); } };
}
$("#searchBtn").onclick = openPalette;
document.addEventListener("keydown", (e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openPalette(); } });
$("#menuBtn").onclick = () => $("#side").classList.toggle("open");
$("#resetBtn").onclick = (e) => { const b = e.currentTarget; if (b.dataset.armed) { S = seed(); save(); imp = null; delete b.dataset.armed; b.textContent = "Réinitialiser la démo"; toast("Démo réinitialisée"); location.hash = "accueil"; route(); } else { b.dataset.armed = "1"; b.textContent = "Confirmer : tout effacer ?"; setTimeout(() => { delete b.dataset.armed; b.textContent = "Réinitialiser la démo"; }, 4000); } };

function bind(v) {
  const view = $("#view");
  view.onclick = (e) => {
    const t = e.target.closest("[data-act],[data-open],[data-sort],[data-contact],[data-app],[data-cx],[data-triage]"); if (!t) return;
    if (t.matches("a.it")) e.preventDefault();
    if (t.dataset.open) { e.preventDefault(); return openRow(t.dataset.open); }
    if (t.dataset.sort) { sort = sort?.id === t.dataset.sort ? (sort.dir > 0 ? { id: sort.id, dir: -1 } : null) : { id: t.dataset.sort, dir: 1 }; return rerender(); }
    if (t.dataset.contact && !e.target.closest("select")) return openContact(t.dataset.contact);
    if (t.dataset.app && !e.target.closest("select")) return appForm(t.dataset.app);
    if (t.dataset.cx !== undefined) { S.criteria.splice(+t.dataset.cx, 1); save(); return rerender(); }
    if (t.dataset.triage) { triage = t.dataset.triage; return rerender(); }
    act(t.dataset.act, t.dataset, t);
  };
  view.ondblclick = (e) => { const td = e.target.closest("td.cell"); if (td) startEdit(td.dataset.r, td.dataset.f); };
  view.onkeydown = (e) => { const td = e.target.closest("td.cell"); if (td && e.key === "Enter") { e.preventDefault(); startEdit(td.dataset.r, td.dataset.f); } };
  view.onchange = (e) => {
    const t = e.target;
    if (t.dataset.cstage) { S.contacts.find((c) => c.id === t.dataset.cstage).stage = t.value; save(); rerender(); }
    if (t.dataset.astage) { S.apps.find((a) => a.id === t.dataset.astage).stage = t.value; save(); rerender(); }
    if (t.dataset.cf !== undefined) { S.criteria[+t.dataset.cf].f = t.value; save(); rerender(); }
    if (t.dataset.cw !== undefined) { S.criteria[+t.dataset.cw].w = Math.max(0, Math.min(100, +t.value || 0)); save(); rerender(); }
    if (t.dataset.cd !== undefined) { S.criteria[+t.dataset.cd].dir = t.value; save(); rerender(); }
    if (imp && t.dataset.mk !== undefined) imp.map[+t.dataset.mk].keep = t.checked;
    if (imp && t.dataset.mt !== undefined) imp.map[+t.dataset.mt].type = t.value;
    if (imp && t.dataset.mr !== undefined) { imp.map.forEach((m) => (m.role = "")); imp.map[+t.dataset.mr].role = t.value; rerender(); }
    if (imp && t.dataset.mn !== undefined) imp.map[+t.dataset.mn].name = t.value.trim() || imp.map[+t.dataset.mn].name;
    if (t.id === "sheet") { pickSheet(t.value); rerender(); }
    if (t.id === "file" && t.files[0]) loadWorkbook(t.files[0]);
  };
  if (v === "entreprises") {
    const q = $("#q"); q.oninput = () => { search = q.value; const pos = q.selectionStart; rerender(); const n = $("#q"); n.focus(); n.setSelectionRange(pos, pos); };
    $("#addRow").onsubmit = (e) => { e.preventDefault(); const n = $("#newRow").value.trim(); if (!n) return; const ne = orgNameError(n); if (ne) return toast(`« ${n.slice(0, 40)} » : ${ne}`); if (S.rows.some((r) => rowName(r).toLowerCase() === n.toLowerCase())) return toast("Cette entreprise est déjà dans le tableau"); S.rows.push({ id: uid(), cells: { [primary().id]: { v: n } } }); save(); toast(`${n} ajoutée`); rerender(); };
    const ce = $("#cellEdit");
    if (ce) { ce.focus(); ce.select?.(); const { r, f } = editing; let done = false;
      const commit = () => { if (done) return; done = true; const val = ce.value.trim(); const err = validate(S.fields.find((x) => x.id === f), val); editing = null; if (err) { toast(err); return rerender(); } const row = S.rows.find((x) => x.id === r); const before = row.cells[f]?.v ?? ""; if (String(before) === val) return rerender(); const fld = S.fields.find((x) => x.id === f); setCell(r, f, val); rerender(); toast(`${fld.name} mis à jour`, () => { setCell(r, f, before, { why: "Annulation" }); rerender(); }); };
      ce.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); commit(); } if (e.key === "Escape") { done = true; editing = null; rerender(); } }; ce.onblur = commit; }
  }
  if (v === "import" && !imp) { const d = $("#drop"); d.ondragover = (e) => { e.preventDefault(); d.classList.add("over"); }; d.ondragleave = () => d.classList.remove("over"); d.ondrop = (e) => { e.preventDefault(); d.classList.remove("over"); if (e.dataTransfer.files[0]) loadWorkbook(e.dataTransfer.files[0]); }; }
}
function startEdit(r, f) { const row = S.rows.find((x) => x.id === r); if (row.cells[f]?.lock) return toast("Valeur confirmée : déverrouillez-la depuis la fiche pour la modifier"); editing = { r, f }; rerender(); }
function act(a, d, el) {
  if (a === "addfield") return fieldForm();
  if (a === "hidestart") { S.hideStart = true; save(); return rerender(); }
  if (a === "verify") return layer(`<div class="scrim" data-close></div><div class="modal" role="dialog" aria-label="Vérifier en ligne"><div class="row" style="justify-content:space-between"><h2>Vérifier que vos employeurs existent</h2><button class="x" data-close aria-label="Fermer">×</button></div>
    <p class="meta" style="margin:0">Pour chaque nom, la version complète lance une recherche web et attribue un statut, avec sa source :</p>
    <div class="grid" style="gap:8px"><div class="row"><span class="badge good">Vérifiée</span><span class="meta">un site officiel portant ce nom a été trouvé (le site web est complété)</span></div><div class="row"><span class="badge warn">À confirmer</span><span class="meta">seuls des annuaires (LinkedIn, Societe.com…) la citent</span></div><div class="row"><span class="badge bad">Introuvable</span><span class="meta">aucune page publique ne la nomme : vérifiez l'orthographe</span></div></div>
    <div class="grid g3" style="grid-template-columns:repeat(3,1fr)"><div class="sec"><span class="meta">Entreprises</span><b class="num" style="font-size:18px">${S.rows.length}</b></div><div class="sec"><span class="meta">Coût</span><b class="num" style="font-size:18px">${S.rows.length} crédits</b></div><div class="sec"><span class="meta">IA utilisée</span><b style="font-size:18px">Aucune</b></div></div>
    <div class="banner"><b>Non disponible dans la démo :</b> cette vérification a besoin d'une connexion à un moteur de recherche (version complète).</div>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-close>Fermer</button><button class="btn pri" disabled>Approuver et lancer</button></div></div>`);
  if (a === "research") return researchModal(d.scope, d.r);
  if (a === "evid") return evidenceForm(d.r, d.f);
  if (a === "lock") { const r = S.rows.find((x) => x.id === d.r); const c = r.cells[d.f] || (r.cells[d.f] = {}); c.lock = !c.lock; save(); toast(c.lock ? "Valeur confirmée : elle ne sera jamais écrasée" : "Valeur déverrouillée"); rerender(); return openRow(d.r); }
  if (a === "delrow") { const b = el; if (!b.dataset.armed) { b.dataset.armed = 1; b.textContent = "Confirmer la suppression"; return; } const i = S.rows.findIndex((x) => x.id === d.r); const [gone] = S.rows.splice(i, 1); save(); closeLayer(); rerender(); return toast(`${rowName(gone)} supprimée`, () => { S.rows.splice(i, 0, gone); save(); rerender(); }); }
  if (a === "copycsv") { const q = (s) => `"${String(s ?? "").replace(/"/g, '""').replace(/^([=+\-@])/, "'$1")}"`; return copy([S.fields.map((f) => q(f.name)).join(","), ...S.rows.map((r) => S.fields.map((f) => q(r.cells[f.id]?.v)).join(","))].join("\n")); }
  if (a === "newcontact") return contactForm(d.company || "");
  if (a === "delcontact") { const b = el; if (!b.dataset.armed) { b.dataset.armed = 1; b.textContent = "Confirmer la suppression"; return; } const i = S.contacts.findIndex((c) => c.id === d.c); const [gone] = S.contacts.splice(i, 1); save(); closeLayer(); rerender(); return toast(`${gone.name} supprimé·e`, () => { S.contacts.splice(i, 0, gone); save(); rerender(); }); }
  if (a === "newapp") return appForm(null, d.company || "");
  if (a === "delapp") { const b = el; if (!b.dataset.armed) { b.dataset.armed = 1; b.textContent = "Confirmer la suppression"; return; } const i = S.apps.findIndex((x) => x.id === d.a); const [gone] = S.apps.splice(i, 1); save(); closeLayer(); rerender(); return toast("Candidature supprimée", () => { S.apps.splice(i, 0, gone); save(); rerender(); }); }
  if (a === "addcrit") { const f = S.fields.find((x) => ["NUMBER", "CURRENCY", "BOOL"].includes(vt(x))); S.criteria.push({ f: f.id, w: Math.max(0, 100 - S.criteria.reduce((x, c) => x + c.w, 0)), dir: "high" }); save(); return rerender(); }
  if (a === "discover") return researchModal("table");
  if (a === "editws") {
    layer(`<div class="scrim" data-close></div><form class="modal" id="wForm" role="dialog" aria-label="Objectif"><div class="row" style="justify-content:space-between"><h2>Votre objectif</h2><button type="button" class="x" data-close aria-label="Fermer">×</button></div>
      <label class="f">Nom de l'espace<input class="in" id="wN" value="${esc(S.ws.name)}"></label><label class="f">Objectif<textarea class="in" id="wO">${esc(S.ws.objective)}</textarea></label>
      <div class="grid" style="grid-template-columns:1fr 1fr"><label class="f">Villes visées<input class="in" id="wL" value="${esc(S.ws.locations.join(", "))}"></label><label class="f">Postes visés<input class="in" id="wR" value="${esc(S.ws.roles.join(", "))}"></label></div>
      <div class="row" style="justify-content:flex-end"><button class="btn pri" type="submit">Enregistrer</button></div></form>`);
    $("#wForm").onsubmit = (e) => { e.preventDefault(); const sp = (s) => s.split(",").map((x) => x.trim()).filter(Boolean); S.ws = { name: $("#wN").value.trim() || S.ws.name, objective: $("#wO").value.trim(), locations: sp($("#wL").value), roles: sp($("#wR").value) }; save(); closeLayer(); rerender(); };
  }
  if (a === "impcancel") { imp = null; return rerender(); }
  if (a === "impcheck") { if (checkImport()) rerender(); return; }
  if (a === "impback") { imp.step = 2; return rerender(); }
  if (a === "impgo") return commitImport();
}
window.addEventListener("hashchange", route);
route();
</script>
